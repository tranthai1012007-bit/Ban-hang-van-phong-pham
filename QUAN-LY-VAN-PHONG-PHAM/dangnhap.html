
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="CSS/dangnhap.css">
    <link rel="stylesheet" href="Chung/Thanhcongcu.css">
    <link rel="stylesheet" href="Chung/chantrang.css">
</head>
<body>
    <main class="login-page">
        <section class="auth-container">
            <h1>Đăng nhập</h1>
            <p class="login-intro">Chào mừng bạn quay trở lại!</p>

            <form id="loginForm">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    autocomplete="username"
                    required
                >

                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >
                <button type="submit">Đăng nhập</button>
            </form>
        </section>
    </main>
     <script src="Chung/Thanhcongcu.js"></script>
    <script src="JS/dangnhap.js"></script>
    <script src="Chung/chantrang.js"></script>
</body>
</html>
