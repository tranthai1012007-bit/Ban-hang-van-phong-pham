
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Thiên Long Shop</title>

    <link rel="stylesheet" href="CSS/dangnhap.css">
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="trangchu.html">
                Copy Văn phòng phẩm - Thiên Long Shop
            </a>

            <div class="header-actions">
                <a href="#" class="header-link order-link">
                    Kiểm tra<br>đơn hàng
                </a>

                <div class="account-buttons">
    <a href="dangnhap.html" class="header-button">
        Đăng nhập
    </a>
                </div>

                <a href="Giohang.html" class="header-link">
                    Giỏ hàng
                </a>
            </div>
        </div>
    </header>

    <nav class="navigation-bar">
        <a href="trangchu.html">Trang chủ</a>
    </nav>

    <main class="login-page">
        <section class="auth-container">
            <h1>Đăng nhập</h1>
            <p class="login-intro">Chào mừng bạn quay trở lại!</p>

            <form id="loginForm">
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                    autocomplete="username"
                    required
                >

                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Nhập mật khẩu"
                    autocomplete="current-password"
                    required
                >
                <button type="submit">Đăng nhập</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        footer
    </footer>

    <script src="JS/dangnhap.js"></script>
</body>
</html>
