<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Chung/Thanhcongcu.css">
    <link rel="stylesheet" href="CSS/Giohang.css">
    <link rel="stylesheet" href="Chung/chantrang.css">
</head>
<body>
    <main class="gh-main">

        <section class="gh-box gh-cart">
            <h2 class="gh-title">Giỏ hàng của bạn</h2>
            <h3 class="gh-nomal">Sản phẩm thường</h3>
        <article class="gh-border">
            <div id="gh-danh-sach"></div>
        </article>
        </section>
        <section class="gh-box gh-order">
            <h2 class="gh-title">Thông tin đơn hàng:</h2>

            <select class="gh-field" id="gh-loaihd" aria-label="Loại hóa đơn">
                <option value="">Loại hóa đơn</option>
                <option value="canhan">Hóa đơn cá nhân</option>
                <option value="congty">Hóa đơn công ty</option>
            </select>
            <input type="text" id="gh-diachi" class="gh-field" placeholder="Địa chỉ:" aria-label="Địa chỉ">
            <input type="tel" id="gh-sdt" class="gh-field" placeholder="Số điện thoại:" aria-label="Số điện thoại">

            <div class="gh-total">Tổng tiền: <span id="gh-tong">0 đ</span></div>

            <div class="gh-buttons">
                <button type="button" class="gh-btn" id="gh-thanhtoan">Thanh toán</button>
            </div>
                <p class="gh-thongbao" id="gh-thongbao" role="status"></p>
    </section>
    </main>
    <script src="Chung/Thanhcongcu.js"></script>
    <script src="JS/cart.js"></script>
    <script src="JS/Giohang.js"></script>
    <script src="Chung/chantrang.js"></script>
</body>
</html>
