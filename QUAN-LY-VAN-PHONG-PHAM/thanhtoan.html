<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Chung/Thanhcongcu.css">
    <link rel="stylesheet" href="CSS/thanhtoan.css">
    <link rel="stylesheet" href="Chung/chantrang.css">
</head>
<body>
    <main class="main">
        <div class="address-box">
            <label>Địa chỉ nhận hàng:</label>
            <div id="hien-thi-dia-chi" class="address-info">
            </div>
        </div>

        <div class="checkout-box">
            <div class="checkout-header">
                <div>Sản phẩm:</div>
                <div>Đơn giá:</div>
                <div>Số lượng:</div>
                <div>Thành tiền:</div>
            </div>

            <div id="cart-list"></div>

            <div id="empty-cart" class="empty-cart">Không có sản phẩm nào để thanh toán!</div>

            <div class="total-box">
                <div class="total-line">
                    <span>Tạm tính:</span>
                    <span id="subtotal">0đ</span>
                </div>
                <div class="total-line">
                    <span>Phí vận chuyển:</span>
                    <span id="shipping">30.000đ</span>
                </div>
                <div class="total-line grand-total">
                    <span>Tổng cộng:</span>
                    <span id="grand-total">0đ</span>
                </div>
            </div>

            <div class="inputs-row">
                <div class="input-group">
                    <label for="message">Lời nhắn:</label>
                    <input type="text" id="message" placeholder="Lời nhắn cho người bán...">
                </div>
                <div class="input-group">
                    <label for="voucher">Voucher:</label>
                    <input type="text" id="voucher" placeholder="Nhập mã giảm giá...">
                </div>
            </div>

            <div class="order-btn-wrapper">
                <button class="order-btn" id="btn-order">XÁC NHẬN ĐẶT HÀNG</button>
            </div>
        </div>
    </main>

    <footer class="footer">footer</footer>

    <script src="Chung/Thanhcongcu.js"></script>
    <script src="JS/thanhtoan.js"></script>
    <script src="Chung/chantrang.js"></script>
</body>
</html>
